# Golem — Xcode project definition.
#
# This file is the source of truth for the Xcode project. The generated
# Golem.xcodeproj is NOT committed; after editing this file run:
#
#   xcodegen
#
# Docs: https://github.com/yonaskolb/XcodeGen/blob/master/Docs/ProjectSpec.md

name: Golem

options:
  bundleIdPrefix: cz.hlozanek
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set this to your Apple Developer team ID (Xcode > Settings > Accounts).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  GolemKit:
    path: Packages/GolemKit

# Shared by every target. The App Group lets the app and its extensions
# read the same settings. Keep the ID in sync with `AppGroup.id` in GolemKit.
entitlementsCommon: &entitlements
  com.apple.developer.family-controls: true
  com.apple.security.application-groups:
    - group.cz.hlozanek.golem

targets:
  # The app you open: pick apps, set limits, plead with the Golem.
  Golem:
    type: application
    platform: iOS
    sources: [Golem]
    dependencies:
      - package: GolemKit
      - target: GolemMonitor
      - target: GolemShieldConfiguration
      - target: GolemShieldAction
    info:
      path: Golem/Info.plist
      properties:
        CFBundleDisplayName: Golem
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: Golem/Golem.entitlements
      properties: *entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.hlozanek.golem
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Runs in the background; iOS wakes it when a usage limit is reached.
  GolemMonitor:
    type: app-extension
    platform: iOS
    sources: [Extensions/Monitor]
    dependencies:
      - package: GolemKit
    info:
      path: Extensions/Monitor/Info.plist
      properties:
        CFBundleDisplayName: Golem Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).GolemMonitor
    entitlements:
      path: Extensions/Monitor/GolemMonitor.entitlements
      properties: *entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.hlozanek.golem.monitor

  # Draws the shield screen ("The Golem is watching…").
  GolemShieldConfiguration:
    type: app-extension
    platform: iOS
    sources: [Extensions/ShieldConfiguration]
    dependencies:
      - package: GolemKit
    info:
      path: Extensions/ShieldConfiguration/Info.plist
      properties:
        CFBundleDisplayName: Golem Shield
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).GolemShieldConfiguration
    entitlements:
      path: Extensions/ShieldConfiguration/GolemShieldConfiguration.entitlements
      properties: *entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.hlozanek.golem.shield-configuration

  # Handles the shield's buttons (Close app / Plead with the Golem).
  GolemShieldAction:
    type: app-extension
    platform: iOS
    sources: [Extensions/ShieldAction]
    dependencies:
      - package: GolemKit
    info:
      path: Extensions/ShieldAction/Info.plist
      properties:
        CFBundleDisplayName: Golem Shield Action
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).GolemShieldAction
    entitlements:
      path: Extensions/ShieldAction/GolemShieldAction.entitlements
      properties: *entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.hlozanek.golem.shield-action

schemes:
  Golem:
    build:
      targets:
        Golem: all
    test:
      targets:
        - package: GolemKit/GolemKitTests
